<!doctype html><html><head><meta charset=utf8><title>Aide à la codification</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#d50a38"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Codification"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column phone app. Sticky search bar on top, result shown as a rating-plate (plaque signalétique) card. */
:root{
  --bg:#f3f3f4; --surface:#ffffff; --fg:#1b1b1f; --muted:#62646c; --line:#d9dadf;
  --accent:#d50a38; --accent-fg:#ffffff; --ink:#1b1b1f; --ink-fg:#ffffff; --ok:#1f8a4c; --warn-bg:#fff2cf; --warn-fg:#5c4300;
  --font-d:'Archivo',system-ui,sans-serif; --font-m:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131316; --surface:#1e1e23; --fg:#f1f1f3; --muted:#a2a3ab; --line:#35353c;
  --accent:#e8264c; --accent-fg:#ffffff; --ink:#f1f1f3; --ink-fg:#131316; --ok:#4fd08a; --warn-bg:#3b3010; --warn-fg:#ffe29a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131316; --surface:#1e1e23; --fg:#f1f1f3; --muted:#a2a3ab; --line:#35353c;
  --accent:#e8264c; --accent-fg:#ffffff; --ink:#f1f1f3; --ink-fg:#131316; --ok:#4fd08a; --warn-bg:#3b3010; --warn-fg:#ffe29a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--font-d);padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto}
header{padding-top:18px;display:flex;align-items:center;gap:14px}
.logo{flex:none;width:76px;height:auto;border-radius:12px;background:#fff;padding:3px;border:1px solid var(--line)}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1;text-wrap:balance}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:6px 0 0;font-size:15px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.search{display:flex;gap:8px}
.field{flex:1;min-width:0;position:relative}
.field input{width:100%;height:54px;border-radius:14px;border:2px solid var(--ink);background:var(--surface);color:var(--fg);font:700 18px var(--font-d);padding:0 44px 0 16px;text-transform:uppercase;letter-spacing:.02em}
.field input::placeholder{text-transform:none;font-weight:500;color:var(--muted);letter-spacing:0}
.field input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.clear{position:absolute;right:6px;top:7px;width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:22px;cursor:pointer}
.gal{display:block;position:relative;cursor:pointer}.gal u{color:var(--accent)}
.scan{position:relative;flex:none;height:54px;padding:0 16px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-fg);font:800 15px var(--font-d);cursor:pointer;display:flex;align-items:center;gap:8px}
.scan svg{width:22px;height:22px}
.scan.busy{opacity:.6;pointer-events:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.scan:focus-within{outline:3px solid var(--accent)}
.tabs{display:flex;gap:6px;margin:6px 0 4px}
.tab{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font:700 14px var(--font-d);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin:8px 2px 0}
.status{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px dashed var(--line);font-size:14px}
.status.err{border-color:var(--accent)}
h2{font:700 12px var(--font-m);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:9px 14px;font:700 14px var(--font-d);cursor:pointer;min-height:40px}
.chip small{color:var(--muted);font-weight:500;margin-left:6px}
.letters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.letters button{flex:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:700 14px var(--font-m);cursor:pointer}
.letters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.plate{position:relative;background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:18px 16px 16px;margin-top:14px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.plate::before,.plate::after{content:"";position:absolute;top:10px;width:9px;height:9px;border-radius:50%;background:var(--line);box-shadow:inset 0 0 0 2px var(--muted)}
.plate::before{left:10px}.plate::after{right:10px}
.plate .lab{font:600 11px var(--font-m);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center}
.plate .brand{font-size:34px;font-weight:800;text-align:center;letter-spacing:.01em;margin:2px 0 14px;overflow-wrap:anywhere;line-height:1.1}
@keyframes pop{from{transform:scale(.94) translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.plate{animation:none}}
.note{background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:12px}
.sup{display:grid;gap:10px}
.sup+.sup{border-top:2px dashed var(--line);padding-top:14px;margin-top:14px}
.sh{display:flex;gap:12px;align-items:center}
.badge{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;font:800 16px var(--font-d)}
img.badge{object-fit:cover;background:#fff}
.sh h3{margin:0;font-size:22px;line-height:1.1;overflow-wrap:anywhere}
.sh p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.go{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:12px;background:var(--accent);color:var(--accent-fg);text-decoration:none;font:800 16px var(--font-d)}
.go.off{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:600;font-size:14px;text-align:center;padding:8px 12px;height:auto;min-height:48px}
.cred{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px}
.cred dt{font:600 11px var(--font-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cred dd{margin:0;font:600 15px var(--font-m);overflow-wrap:anywhere;min-width:0}
.cred .row{display:contents}
.mini{height:36px;min-width:60px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:700 13px var(--font-d);cursor:pointer}
.mini.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.acts{display:flex;gap:6px}
.cred .full{grid-column:1/-1;font-family:var(--font-d);font-weight:600;color:var(--muted)}
.sugg{margin-top:14px}
.foot{margin-top:28px;font-size:12px;color:var(--muted);text-align:center}
.pick{display:flex;flex-direction:column;gap:8px}
.list{display:grid;gap:10px}
.lrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--fg);cursor:pointer;font:inherit}
.lrow b{display:block;font-size:16px;overflow-wrap:anywhere}
.lrow span.s{font-size:13px;color:var(--muted)}
.lrow .badge{width:38px;height:38px;font-size:14px;border-radius:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ink-fg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:20}
</style>

  const inc=BR.filter(b=>!b.n.startsWith(n)&&b.n.includes(n));

  if(!list.length&&n.length>=3)list=BR.map(b=>[b,lev(n,b.n.slice(0,n.length+1))]).filter(x=>x[1]<=2).sort((a,b)=>a[1]-b[1]).slice(0,6).map(x=>x[0]);
  return{exact,list,fuzzy:!starts.length&&!inc.length};
}
function credHTML(s){
  const L=s.login,P=s.pwd;const rows=[];
  const free=/^(acc[eè]s libre|acces individuel|voir )/i.test(L);
  if(L){ if(free) rows.push(`<div class="full">${esc(L==='ACCES INDIVIDUEL'?'Accès individuel : utilise ton propre compte':L)}</div>`);
    else rows.push(`<dt>Identifiant</dt><dd>${esc(L)}</dd><button class="mini" data-copy="${esc(L)}">Copier</button>`)}
  if(P) rows.push(`<dt>Mot de passe</dt><dd class="pw" data-pw="${esc(P)}">••••••••</dd><div class="acts"><button class="mini" data-eye>Voir</button><button class="mini" data-copy="${esc(P)}">Copier</button></div>`);
  return rows.length?`<dl class="cred">${rows.join('')}</dl>`:'';
}
function supHTML(key){
  const s=SUP[key];
  if(!s)return `<div class="sup"><div class="sh">${badge(key)}<div><h3>${esc(key)}</h3><p>Accès non renseigné</p></div></div><div class="go off">Pas d'identifiants dans le glossaire : demande à la cellule technique.</div></div>`;
  const link=s.url?`<a class="go" href="${esc(s.url)}" target="_blank" rel="noopener">${/play\.google\.com|apps\.apple\.com/.test(s.url)?'Ouvrir l\'application '+esc(s.app||s.name):'Ouvrir le site du fournisseur'} ↗</a>`:
    `<div class="go off">Application à ouvrir sur ton téléphone : <b>&nbsp;${esc(s.app)}</b></div>`;
  const sub=s.app&&s.url?`Application : ${esc(s.app)}`:(s.app?'Application':'Site web');
  return `<div class="sup"><div class="sh">${badge(s.name)}<div><h3>${esc(s.name)}</h3><p>${sub}</p></div></div>${link}${credHTML(s)}</div>`;
}
function showBrand(b){
  saveRecent(b.b);
  const simple=b.s.length===1&&norm(b.t)===norm(b.s[0]);
  const multi=b.s.length>1;
  $('out').innerHTML=`<section class="plate"><div class="lab">Marque</div><div class="brand">${esc(b.b)}</div>
   ${(!simple&&b.t)?`<div class="note">${multi?'Plusieurs fournisseurs possibles. ':''}Consigne : ${esc(b.t)}</div>`:''}
   ${b.s.map(supHTML).join('')}</section>`;
  scrollTo({top:0,behavior:'smooth'});
}
function chip(b){return `<button class="chip" data-brand="${esc(b.b)}">${esc(b.b)}</button>`}
function renderBrandView(){
  const q=$('q').value;$('clr').hidden=!q;
  if(!q){
    const letters=[...new Set(BR.map(b=>b.b[0].toUpperCase()))].sort();
    let h='';
    if(recents.length)h+=`<h2>Dernières recherches</h2><div class="chips">${recents.map(r=>BR.find(b=>b.b===r)).filter(Boolean).map(chip).join('')}</div>`;
    h+=`<h2>Toutes les marques</h2><div class="letters">${letters.map(l=>`<button data-l="${l}" aria-pressed="${l===letter}">${l}</button>`).join('')}</div>`;
    const shown=letter?BR.filter(b=>b.b[0].toUpperCase()===letter):BR;
    h+=`<div class="chips">${shown.map(chip).join('')}</div>`;
    $('out').innerHTML=h;return;
  }
  const r=search(q);
  if(r.exact){showBrand(r.exact);return}
  if(r.list.length===1&&!r.fuzzy&&norm(q).length>=3){showBrand(r.list[0]);return}
  if(r.list.length){$('out').innerHTML=`<h2>${r.fuzzy?'Tu voulais dire ?':'Quelle marque ?'}</h2><div class="chips">${r.list.map(chip).join('')}</div>`;return}
  $('out').innerHTML=`<div class="status err"><b>« ${esc(q)} » n'est pas dans la liste.</b><br>Vérifie l'orthographe sur la plaque, ou demande à la cellule technique quel fournisseur utiliser.</div>`;
}
function renderSuppliers(){
  $('clr').hidden=true;
  $('out').innerHTML=`<h2>${DATA.sup.length} fournisseurs</h2><div class="list">${DATA.sup.map(s=>{
    const n=BR.filter(b=>b.s.includes(s.name)).length;
    return `<button class="lrow" data-sup="${esc(s.name)}">${badge(s.name)}<div><b>${esc(s.name)}</b><span class="s">${n?n+' marque'+(n>1?'s':''):'accès direct'}${s.app&&!s.url?' · application':''}</span></div></button>`}).join('')}</div>`;
}
function showSup(name){$('out').innerHTML=`<section class="plate"><div class="lab">Fournisseur</div>${supHTML(name)}</section><div class="sugg"><h2>Marques concernées</h2><div class="chips">${BR.filter(b=>b.s.includes(name)).map(chip).join('')||'<span class="hint">Aucune marque associée.</span>'}</div></div>`;scrollTo({top:0})}
function render(){view==='brand'?renderBrandView():renderSuppliers()}
function setView(v){view=v;$('t1').setAttribute('aria-selected',v==='brand');$('t2').setAttribute('aria-selected',v==='sup');$('q').disabled=v!=='brand';render()}
$('t1').onclick=()=>setView('brand');$('t2').onclick=()=>setView('sup');
$('q').addEventListener('input',render);
$('clr').onclick=()=>{$('q').value='';render();$('q').focus()};
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.brand){const b=BR.find(x=>x.b===t.dataset.brand);if(b){$('q').value=b.b;$('clr').hidden=false;showBrand(b)}}
  else if(t.dataset.l){letter=letter===t.dataset.l?'':t.dataset.l;renderBrandView()}
  else if(t.dataset.copy!==undefined)copy(t.dataset.copy,t);
  else if(t.dataset.eye!==undefined){const pw=t.closest('dl').querySelector('.pw');const open=pw.textContent!=='••••••••';pw.textContent=open?'••••••••':pw.dataset.pw;t.textContent=open?'Voir':'Cacher'}
  else if(t.dataset.sup)showSup(t.dataset.sup);
});
// ---- Scan via Claude (lecture de la plaque signalétique)
async function toBlob(file){
  try{
    const url=URL.createObjectURL(file);
    const img=new Image();
    await new Promise((ok,ko)=>{img.onload=ok;img.onerror=ko;img.src=url});
    const k=Math.min(1,1400/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
    if(b&&b.size>0)return b;
  }catch(_){}
  return file; // repli : on envoie la photo d'origine telle quelle
}
function setStatus(h,err,thumb){$('out').innerHTML=(thumb?`<img src="${thumb}" alt="Photo prise" style="width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-bottom:10px">`:'')+`<div class="status${err?' err':''}">${h}</div>`}
// Retrouve la marque dans la liste : d'abord ce que Claude propose, puis le texte lu sur la photo
function matchBrands(j){
  const out=[];const add=b=>{if(b&&!out.includes(b))out.push(b)};
  (Array.isArray(j.marques)?j.marques:[]).forEach(n=>add(BR.find(b=>b.n===norm(n))));
  if(!out.length){
    const lu=norm(j.lu||'');
    if(lu.length>=2){
      BR.filter(b=>b.n===lu).forEach(add);
      if(!out.length)BR.filter(b=>b.n.length>=4&&lu.includes(b.n)).sort((a,b)=>b.n.length-a.n.length).slice(0,3).forEach(add);
      if(!out.length&&lu.length>=4)BR.filter(b=>b.n.includes(lu)).slice(0,3).forEach(add);
      if(!out.length&&lu.length>=4)BR.map(b=>[b,lev(lu,b.n)]).filter(x=>x[1]<=1&&x[0].n.length>=4).slice(0,3).forEach(x=>add(x[0]));
    }
  }
  return out.slice(0,3);
}
const WHY={
  not_granted:"Autorisation refusée. Relance « Scan » et accepte la demande.",
  rate_limited:"Trop de scans d'affilée. Attends un peu puis réessaie.",
  image_rejected:"La photo n'a pas pu être lue (format ou taille). Reprends-la.",
  images_unavailable:"L'envoi de photos n'est pas autorisé dans cette vue.",
  session_expired:"Session expirée. Reconnecte-toi puis réessaie."
};
// Hors de Claude (fichier ouvert en local) : lecture du texte directement sur le téléphone
function loadScript(src){return new Promise((ok,ko)=>{const el=document.createElement('script');el.src=src;el.onload=ok;el.onerror=()=>ko(new Error('script'));document.head.appendChild(el)})}
async function localOcr(img){
  if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  const r=await window.Tesseract.recognize(img,'eng',{logger:m=>{const el=document.getElementById('ocrst');if(el&&m&&m.status)el.textContent=m.status+(m.progress?' '+Math.round(m.progress*100)+' %':'')}});
  return (r&&r.data&&r.data.text)||'';
}
function matchFromText(text){
  const tn=norm(text);const toks=[...new Set(text.split(/[^A-Za-z0-9+]+/).map(norm).filter(t=>t.length>=2))];
  const hit=[];
  for(const b of BR){
    let sc=0;
    if(/\s/.test(b.b)){ if(tn.includes(b.n))sc=b.n.length+2 }
    else if(toks.includes(b.n))sc=b.n.length+3;
    else if(b.n.length>=5)for(const t of toks){ if(t.length>=5&&Math.abs(t.length-b.n.length)<=1&&lev(t,b.n)<=1){sc=b.n.length;break} }
    if(sc)hit.push([b,sc]);
  }
  return hit.sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
}
async function onPick(inp){
  const f=inp.files&&inp.files[0];
  if(!f){setStatus("Aucune photo reçue. Réessaie avec « Scan ».",true);return}
  setView('brand');$('q').value='';$('scan').classList.add('busy');
  let thumb='',tick=null;
  try{
    const img=await toBlob(f);thumb=URL.createObjectURL(img);
    const t0=Date.now();
    setStatus('Lecture de la plaque en cours… <b id="wait">0 s</b><br><small>La 1re fois, accepte la demande d\'autorisation de Claude.</small>',false,thumb);
    tick=setInterval(()=>{const el=document.getElementById('wait');if(el)el.textContent=Math.round((Date.now()-t0)/1000)+' s'},1000);
    if(!sampleFn)sampleFn=await window.claude?.use?.('sample');
    if(!sampleFn){
      setStatus('Lecture de la plaque sur ton téléphone… <b id="wait">0 s</b><br><small id="ocrst">Chargement du lecteur (la 1re fois, quelques secondes)…</small>',false,thumb);
      try{
        const text=await localOcr(img);
        const found=matchFromText(text);
        if(found.length===1){$('q').value=found[0].b;showBrand(found[0])}
        else if(found.length>1){$('out').innerHTML=`<h2>Marques possibles</h2><div class="chips">${found.map(chip).join('')}</div>`}
        else{
          const seen=text.replace(/\s+/g,' ').trim().slice(0,100);
          setStatus(`Aucune marque de la liste reconnue${seen?` (texte lu : <i>${esc(seen)}</i>)`:''}. Tape la marque ci-dessus. Pour une lecture plus précise, ouvre la page depuis son lien Claude : <a href="https://claude.ai/artifact/UtZhK8NDGgXMemJAYwBezL" target="_blank" rel="noopener">ouvrir dans Claude</a>.`,true,thumb);
        }
      }catch(_){
        setStatus('Le scan n\'est pas disponible ici (page ouverte hors de Claude et lecteur non chargé). Ouvre la page depuis son lien Claude : <a href="https://claude.ai/artifact/UtZhK8NDGgXMemJAYwBezL" target="_blank" rel="noopener">ouvrir dans Claude</a>, ou tape la marque ci-dessus.',true,thumb);
      }
      return;
    }
    let lim=null;try{lim=await sampleFn.limits()}catch(_){}
    if(lim&&!lim.images){setStatus('Le scan par photo n\'est pas autorisé dans cette vue. Tape la marque ci-dessus.',true,thumb);$('q').focus();return}
    const names=BR.map(b=>b.b).join(', ');
    const res=await sampleFn(`Cette photo montre la plaque signalétique, l'étiquette ou la face avant d'un appareil électroménager. Trouve la marque (logo ou texte, souvent en haut de la plaque). Réponds uniquement par un objet JSON de la forme {"lu":"marque telle qu'écrite sur la photo, vide si illisible","marques":["nom de la liste"]}. Le tableau "marques" contient au maximum 3 noms pris EXACTEMENT dans la liste ci-dessous, le plus probable en premier, et reste vide si aucun ne correspond. Liste : ${names}`,{images:[img],cache:false});
    const m=(res.text||'').match(/\{[\s\S]*\}/);let j={};try{j=m?JSON.parse(m[0]):{}}catch(_){}
    const found=matchBrands(j);
    if(found.length===1){$('q').value=found[0].b;showBrand(found[0])}
    else if(found.length>1){$('out').innerHTML=`<h2>Marques possibles</h2><div class="chips">${found.map(chip).join('')}</div>`}
    else setStatus(`Aucune marque de la liste reconnue${j.lu?` (lu : <b>${esc(j.lu)}</b>)`:` (réponse : ${esc((res.text||'').slice(0,120))})`}. Retente avec une photo plus nette ou tape la marque ci-dessus.`,true,thumb);
  }catch(e){
    const c=e&&e.code?e.code:'inconnu';
    const why=WHY[c]||('Scan impossible, code : <b>'+esc(c)+'</b>'+(e&&e.message?' — '+esc(String(e.message).slice(0,140)):'')+'.');
    setStatus(why+' Tu peux aussi taper la marque ci-dessus.',true,thumb);
  }finally{
    if(tick)clearInterval(tick);
    $('scan').classList.remove('busy');
    try{inp.value=''}catch(_){}
  }
}
['file','file2'].forEach(id=>$(id).addEventListener('change',e=>onPick(e.target)));
(async()=>{try{sampleFn=await window.claude?.use?.('sample')}catch(e){}})();
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
